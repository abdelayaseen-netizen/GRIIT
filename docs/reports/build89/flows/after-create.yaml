appId: app.griit.challenge-tracker
---
- tapOn: "Create"
- tapOn: "Challenge title"
- inputText: "Build eighty nine"
- tapOn: "Name your challenge"
- tapOn: "Discipline"
- scrollUntilVisible:
    element: "7 days. Day 1 is today."
    direction: DOWN
- assertVisible: "7 days. Day 1 is today."
- tapOn: "Continue"
- tapOn: "Custom"
- tapOn: "Add a task"
- tapOn: "e.g. Read 10 pages"
- inputText: "Evening journal"
- tapOn: "What you do"
- scrollUntilVisible:
    element: "Add task"
    direction: DOWN
- tapOn: "Add task"
- tapOn: "Starter packs"
- tapOn: "Athlete"
- tapOn: "Continue"
- assertVisible: "How strict?"
- assertVisible: "Strict"
- assertNotVisible: "Hard"
- tapOn: "Invite.*"
- tapOn: "Review"
- assertVisible: "Evening journal"
- assertVisible: "Discipline · .*"
- assertNotVisible: "Anyone can find and join"
- assertVisible: "Only people you invite"
- assertNotVisible: "Day 1 of 7 is today"
- tapOn: "Start the challenge"
- assertVisible: "Morning run"
- assertVisible: "Workout"
- assertVisible: "Body check-in"
- assertVisible: "Evening journal"
- assertNotVisible: "Day 1 of 7 is today"
