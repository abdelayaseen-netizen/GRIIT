appId: app.griit.challenge-tracker
---
# Fresh guest joins, lands on Home, and the first task opens.
- launchApp:
    clearState: true
    permissions:
      notifications: deny
      camera: allow
      photos: allow
- tapOn:
    text: "http://localhost:8081"
    optional: true
- tapOn:
    text: "http://localhost:8082"
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- extendedWaitUntil:
    visible: "Start"
    timeout: 45000
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Physical toughness.*"
    timeout: 15000
- tapOn: "Physical toughness.*"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "How it works"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Show Up 7.*"
    timeout: 20000
- tapOn: "Set this up later"
- extendedWaitUntil:
    visible: "No reminders for now"
    timeout: 20000
- tapOn: "No reminders for now"
- extendedWaitUntil:
    visible: "Find a challenge"
    timeout: 25000
- openLink: "griit://challenge/e44f0001-4000-4000-8000-000000000003"
- extendedWaitUntil:
    visible: "Join Early Riser 7"
    timeout: 20000
- tapOn: "Join Early Riser 7"
- extendedWaitUntil:
    visible: "Up and out of bed"
    timeout: 25000
- assertVisible: "Home"
- tapOn: "Up and out of bed"
- extendedWaitUntil:
    visible: "Take proof photo|Window closed.*"
    timeout: 20000
