  <text x="850" y="78" class="overall" text-anchor="end">OVERALL</text>
  <text x="1040" y="92" class="overallVal" text-anchor="end">88.6 / 100</text>

  <!-- Legend -->
  <g transform="translate(56,116)">
    <rect x="0" y="0" width="18" height="14" class="barFinal"/>
    <text x="26" y="12" class="legendText">Final score (this sprint)</text>
    <rect x="200" y="0" width="18" height="14" class="barPrior"/>
    <text x="226" y="12" class="legendText">Prior pass (n/a where new)</text>
    <text x="420" y="12" class="legendText">” reflects this sprint's contribution.</text>
  </g>

  <!-- Chart area: y=160..640, x=240..1040 -->
  <!-- Grid lines at 0, 25, 50, 75, 100 -->
  <g class="grid">
    <line x1="240" y1="160" x2="240" y2="640"/>
    <line x1="240" y1="640" x2="1040" y2="640"/>
  </g>
  <g>
    <text x="240" y="660" class="axisText" text-anchor="middle">0</text>
    <line x1="440" y1="160" x2="440" y2="640" stroke="#E5E5E5" stroke-dasharray="2 4"/>
    <text x="440" y="660" class="axisText" text-anchor="middle">25</text>
    <line x1="640" y1="160" x2="640" y2="640" stroke="#E5E5E5" stroke-dasharray="2 4"/>
    <text x="640" y="660" class="axisText" text-anchor="middle">50</text>
    <line x1="840" y1="160" x2="840" y2="640" stroke="#E5E5E5" stroke-dasharray="2 4"/>
    <text x="840" y="660" class="axisText" text-anchor="middle">75</text>
    <line x1="1040" y1="160" x2="1040" y2="640" stroke="#E5E5E5" stroke-dasharray="2 4"/>
    <text x="1040" y="660" class="axisText" text-anchor="middle">100</text>
  </g>

  <!-- 10 rows. Row height 44, top of first row at y=170. Bar height 16 (final) above 12 (prior). -->
