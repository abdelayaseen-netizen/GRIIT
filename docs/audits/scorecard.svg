<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <!-- Tokens copied verbatim from lib/design-system.ts so the SVG is self-contained -->
  <defs>
    <style>
      .bg { fill: #F5F5F5; }
      .card { fill: #FFFFFF; }
      .grid { stroke: #E5E5E5; stroke-width: 1; }
      .axis { stroke: #666666; stroke-width: 1.5; }
      .axisText { fill: #111111; font-size: 12px; }
      .barFinal { fill: #BB471D; }
      .barPrior { fill: #FAECE7; stroke: #BB471D; stroke-width: 1; stroke-dasharray: 4 3; }
      .scoreLabel { fill: #FFFFFF; font-size: 13px; font-weight: 700; }
      .scoreLabelDark { fill: #111111; font-size: 13px; font-weight: 700; }
      .legendBox { stroke: #111111; stroke-width: 1; }
      .legendText { fill: #111111; font-size: 13px; }
      .title { fill: #111111; font-size: 22px; font-weight: 700; }
      .subtitle { fill: #666666; font-size: 13px; }
      .overall { fill: #111111; font-size: 18px; font-weight: 700; }
      .overallVal { fill: #BB471D; font-size: 32px; font-weight: 800; }
      .delta { font-size: 12px; font-weight: 600; }
      .deltaPos { fill: #3D7A5A; }
      .deltaNeg { fill: #BB471D; }
      .deltaZero { fill: #8A8A8A; }
    </style>
  </defs>

  <rect width="1100" height="720" class="bg"/>
  <rect x="32" y="32" width="1036" height="656" rx="8" class="card"/>

  <text x="56" y="74" class="title">GRIIT Deep Clean Scorecard  2026-05-10</text>
