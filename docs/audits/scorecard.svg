  <text x="232" y="186" class="axisText" text-anchor="end">1. Repo consolidation</text>
  <rect x="240" y="172" width="736" height="20" class="barFinal"/>
  <text x="970" y="187" class="scoreLabel" text-anchor="end">92</text>
  <text x="982" y="187" class="delta deltaZero">n/a</text>

  <!-- 2. Dead code: 86 (no prior) -->
  <text x="232" y="220" class="axisText" text-anchor="end">2. Dead code</text>
  <rect x="240" y="206" width="688" height="20" class="barFinal"/>
  <text x="922" y="221" class="scoreLabel" text-anchor="end">86</text>
  <text x="934" y="221" class="delta deltaZero">n/a</text>

  <!-- 3. Code structure: 71 (no prior) -->
  <text x="232" y="254" class="axisText" text-anchor="end">3. Code structure</text>
  <rect x="240" y="240" width="568" height="20" class="barFinal"/>
  <text x="802" y="255" class="scoreLabel" text-anchor="end">71</text>
  <text x="814" y="255" class="delta deltaZero">n/a</text>

