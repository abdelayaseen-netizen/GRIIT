  <rect x="240" y="274" width="768" height="20" class="barFinal"/>
  <text x="1002" y="289" class="scoreLabel" text-anchor="end">96</text>
  <text x="1014" y="289" class="delta deltaPos">+24</text>

  <!-- 5. Accessibility: 98 from 65 -->
  <text x="232" y="322" class="axisText" text-anchor="end">5. Accessibility</text>
  <rect x="240" y="312" width="520" height="14" class="barPrior"/>
  <rect x="240" y="308" width="784" height="20" class="barFinal"/>
  <text x="1018" y="323" class="scoreLabel" text-anchor="end">98</text>
  <text x="1030" y="323" class="delta deltaPos">+33</text>

  <!-- 6. Performance: 89 from 74 -->
  <text x="232" y="356" class="axisText" text-anchor="end">6. Performance</text>
  <rect x="240" y="346" width="592" height="14" class="barPrior"/>
  <rect x="240" y="342" width="712" height="20" class="barFinal"/>
  <text x="946" y="357" class="scoreLabel" text-anchor="end">89</text>
  <text x="958" y="357" class="delta deltaPos">+15</text>

  <!-- 7. Backend hardening: 78 from 83  -->
  <text x="232" y="390" class="axisText" text-anchor="end">7. Backend hardening</text>
  <rect x="240" y="380" width="664" height="14" class="barPrior"/>
  <rect x="240" y="376" width="624" height="20" class="barFinal"/>
  <text x="858" y="391" class="scoreLabel" text-anchor="end">78</text>
  <text x="870" y="391" class="delta deltaNeg">-5*</text>

  <!-- 8. Auth & security: 91 from 79 -->
  <text x="232" y="424" class="axisText" text-anchor="end">8. Auth &amp; security</text>
  <rect x="240" y="414" width="632" height="14" class="barPrior"/>
  <rect x="240" y="410" width="728" height="20" class="barFinal"/>
  <text x="962" y="425" class="scoreLabel" text-anchor="end">91</text>
  <text x="974" y="425" class="delta deltaPos">+12</text>

