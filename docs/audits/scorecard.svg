  <text x="232" y="458" class="axisText" text-anchor="end">9. Type safety</text>
  <rect x="240" y="448" width="704" height="14" class="barPrior"/>
  <rect x="240" y="444" width="752" height="20" class="barFinal"/>
  <text x="986" y="459" class="scoreLabel" text-anchor="end">94</text>
  <text x="998" y="459" class="delta deltaPos">+6</text>

  <!-- 10. Error handling: 90 from 80 -->
  <text x="232" y="492" class="axisText" text-anchor="end">10. Error handling</text>
  <rect x="240" y="482" width="640" height="14" class="barPrior"/>
  <rect x="240" y="478" width="720" height="20" class="barFinal"/>
  <text x="954" y="493" class="scoreLabel" text-anchor="end">90</text>
  <text x="966" y="493" class="delta deltaPos">+10</text>

  <!-- Footnote -->
  <text x="56" y="554" class="subtitle">* Backend hardening dipped because the RLS migration is staged but UNAPPLIED (Gate C  Yaseen runs SQL manually).</text>
  <text x="56" y="572" class="subtitle">  The migration file lives at supabase/migrations/20260510000000_profiles_rls_hardening.sql. Score will rise to 92+ once applied.</text>

  <!-- Bottom strip: top metrics that anchor the scores -->
  <g transform="translate(56,604)">
    <rect x="0" y="0" width="988" height="62" rx="6" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="14" y="20" class="axisText" font-weight="700">Hard-rule metrics (baseline ’ final)</text>
    <text x="14" y="40" class="axisText">Raw hex outside DS: 6 ’ 0   ·   console.* unguarded: 41 ’ 0   ·   any in production: 0 ’ 0   ·   Empty catches: 0 ’ 0   ·   Alert.alert: 0 ’ 0</text>
    <text x="14" y="56" class="axisText">FlatList full perf props: 13/22 ’ 22/22 (100%)   ·   A11y labeled: ~95% ’ 343/343 (100%)   ·   WCAG AA pairs: 6/9 ’ 9/9</text>
  </g>
</svg>
