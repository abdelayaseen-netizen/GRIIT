appId: app.griit.challenge-tracker
---
- launchApp:
    stopApp: true
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
- tapOn: "Home"
- tapOn: "Expand section, 7K Steps"
- assertVisible: "Walk 7,000 steps"
- assertVisible: "Done for today"
- tapOn: "Expand section, Show Up 7"
- assertVisible: "Get to the gym"
