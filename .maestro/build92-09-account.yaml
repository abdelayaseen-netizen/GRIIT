appId: app.griit.challenge-tracker
---
# Build 92 chunk 09 P3-08: the guest Save your streak sheet with the email-code form.
# Needs FLAGS.EMAIL_OTP on locally. No code is sent (Supabase OTP is not enabled yet).
- runFlow: build92-guest-home.yaml
- openLink: "griit://challenge/e44f0001-4000-4000-8000-000000000002"
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Join 7K Steps"
    timeout: 20000
- tapOn: "Join 7K Steps"
- extendedWaitUntil:
    visible: "Walk 7,000 steps|^Done$"
    timeout: 20000
- tapOn:
    id: "home-task"
    optional: true
- extendedWaitUntil:
    visible: "^Done$"
    timeout: 15000
- tapOn: "^Done$"
- extendedWaitUntil:
    visible: "Post your proof"
    timeout: 20000
- tapOn: "Post to friends"
- extendedWaitUntil:
    visible: "Every task today is done.*|Day secured|Day 1 secured.*"
    timeout: 20000
- tapOn: "^Done$"
- extendedWaitUntil:
    visible: "Save your streak"
    timeout: 15000
- assertVisible: "Not now"
- assertVisible:
    id: "account-email"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: P3-08-account
- tapOn:
    id: "account-email"
- inputText: "build92.p308@example.com"
- tapOn: "Save your streak"
- takeScreenshot: P3-08-account-email
- tapOn: "Not now"
- extendedWaitUntil:
    notVisible: "Save your streak"
    timeout: 10000
