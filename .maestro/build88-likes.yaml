appId: app.griit.challenge-tracker
---
# Fresh account, then heart unlike, then double-tap the photo likes and does not unlike.
- launchApp:
    clearState: true
    permissions:
      notifications: deny
      camera: allow
      photos: allow
- tapOn:
    text: "http://localhost:8081"
    optional: true
- tapOn:
    text: "http://localhost:8082"
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- extendedWaitUntil:
    visible: "Start"
    timeout: 45000
- tapOn: "Start"
- tapOn: "Physical toughness.*"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "How it works"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Show Up 7.*"
    timeout: 20000
- tapOn: "Set this up later"
- extendedWaitUntil:
    visible: "No reminders for now"
    timeout: 20000
- tapOn: "No reminders for now"
- extendedWaitUntil:
    visible: "No challenge yet.*"
    timeout: 25000
- tapOn: "Profile"
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "You're using GRIIT as a guest.*"
    timeout: 15000
- tapOn: "You're using GRIIT as a guest.*"
- extendedWaitUntil:
    visible: "Continue with email"
    timeout: 15000
- tapOn: "Continue with email"
- tapOn:
    id: "account-email"
- inputText: "b89likes15@example.com"
- tapOn:
    id: "account-password"
- inputText: "Build88-guest-test"
- hideKeyboard
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Send it"
    timeout: 10000
- tapOn: "Send it"
- tapOn:
    text: "Go back"
    optional: true
- openLink: "griit://challenge/b2000001-4000-4000-8000-000000000001"
- extendedWaitUntil:
    visible: "Join Drink Water Today"
    timeout: 20000
- tapOn: "Join Drink Water Today"
- extendedWaitUntil:
    visible: "Drink water and post a photo"
    timeout: 20000
- tapOn:
    id: "home-task"
- extendedWaitUntil:
    visible: "Take proof photo"
    timeout: 20000
- tapOn: "Take proof photo"
- extendedWaitUntil:
    visible: "Post to friends"
    timeout: 20000
- tapOn: "Post to friends"
- extendedWaitUntil:
    visible: "Back to today"
    timeout: 60000
- tapOn: "Back to today"
- tapOn: "Show feed from people you follow"
- scrollUntilVisible:
    element: "Like"
    direction: DOWN
    timeout: 25000
    visibilityPercentage: 40
    centerElement: true
- tapOn: "Like"
- extendedWaitUntil:
    visible: "Liked by you"
    timeout: 8000
- swipe:
    direction: UP
    duration: 500
- swipe:
    direction: DOWN
    duration: 500
- tapOn: "Liked by you"
- assertNotVisible: "Liked by you"
