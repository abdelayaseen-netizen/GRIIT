appId: app.griit.challenge-tracker
---
# Build 90 chunk 08 Friend loop, account B: a brand-new guest on a fresh install opens the
# link account A's run wrote to a file (INVITE_LINK=griit://i/<challenge id>, from
# /tmp/b90-08-link.txt), lands on that invite-only challenge with Join, joins, and lands on
# the first task. No onboarding first: the link is the way in. Run build90-friend-loop.yaml
# first (it creates the challenge), then:
#   maestro test -e INVITE_LINK="$(cat /tmp/b90-08-link.txt)" .maestro/build90-friend-loop-b.yaml
- launchApp:
    clearState: true
    permissions:
      notifications: deny
      camera: deny
- extendedWaitUntil:
    visible: "http://localhost:8081|Start|Continue"
    timeout: 60000
- tapOn:
    text: "http://localhost:8081"
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- extendedWaitUntil:
    visible: "Start"
    timeout: 60000
# 08.2 the link lands a guest with no account on the challenge page, not on onboarding.
- openLink: ${INVITE_LINK}
- extendedWaitUntil:
    visible: "Join Friend loop walk"
    timeout: 30000
- assertVisible: "Friend loop walk"
- assertNotVisible: "Physical toughness.*"
- takeScreenshot: build90-08-guest-link-join
- tapOn: "Join Friend loop walk"
# After joining, the first task opens (02.2 rule), no welcome or reminder screens between.
- extendedWaitUntil:
    visible: "Walk ten minutes|^Done$"
    timeout: 30000
- assertVisible: "^Done$"
- takeScreenshot: build90-08-guest-first-task
- extendedWaitUntil:
    visible: "Not yet"
    timeout: 15000
- tapOn: "Not yet"
# board_opt_in: both members are on the board the moment B joins (no "A board needs two").
- extendedWaitUntil:
    visible: "Home"
    timeout: 20000
- tapOn: "Activity"
- tapOn: "Leaderboard"
- extendedWaitUntil:
    visible: "Rank 1|Friend loop walk"
    timeout: 20000
- assertNotVisible: "A board needs two."
- assertVisible: "Rank 1"
- assertVisible: "Rank 2"
- takeScreenshot: build90-08-board-two
