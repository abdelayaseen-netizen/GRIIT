appId: app.griit.challenge-tracker
---
# Faith goal through the first check-off.
- launchApp:
    clearState: true
    permissions:
      notifications: deny
      camera: allow
      photos: allow
- tapOn:
    text: "http://localhost:8081"
    optional: true
- tapOn:
    text: "http://localhost:8082"
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- extendedWaitUntil:
    visible: "Start"
    timeout: 45000
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Physical toughness.*"
    timeout: 15000
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- extendedWaitUntil:
    visible: "Faith and prayer.*"
    timeout: 10000
- tapOn:
    point: "50%,83%"
- extendedWaitUntil:
    visible: "^Continue$"
    timeout: 10000
- tapOn: "^Continue$"
- extendedWaitUntil:
    visible: "How it works"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Set this up later"
    timeout: 20000
- tapOn: "Set this up later"
- extendedWaitUntil:
    visible: "No reminders for now"
    timeout: 20000
- tapOn: "No reminders for now"
- extendedWaitUntil:
    visible: "No challenge yet.*"
    timeout: 25000
- openLink: "griit://challenge/e44f0001-4000-4000-8000-000000000007"
- extendedWaitUntil:
    visible: "Join Quran Daily"
    timeout: 20000
- tapOn: "Join Quran Daily"
- extendedWaitUntil:
    visible: "Read at least 1 page of Quran"
    timeout: 20000
- tapOn:
    id: "home-task"
- extendedWaitUntil:
    visible: "^Done$"
    timeout: 15000
- tapOn: "^Done$"
- extendedWaitUntil:
    visible: "Day 1 secured.*"
    timeout: 20000
