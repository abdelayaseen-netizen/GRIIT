appId: app.griit.challenge-tracker
---
# Chunk 04: after a check-off task, one Friends / Everyone / Keep it private sheet.
# Keep it private lands on Home with today's count moved. Fresh guest each run.
- launchApp:
    clearState: true
    permissions:
      notifications: deny
      camera: deny
- extendedWaitUntil:
    visible: "http://localhost:8081|Start|Continue"
    timeout: 60000
- tapOn:
    text: "http://localhost:8081"
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- extendedWaitUntil:
    visible: "Start"
    timeout: 60000
- tapOn: "Start"
- tapOn: "Physical toughness.*"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "How it works"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Set this up later"
    timeout: 20000
- tapOn: "Set this up later"
- extendedWaitUntil:
    visible: "No reminders for now"
    timeout: 20000
- tapOn: "No reminders for now"
- extendedWaitUntil:
    visible:
      id: "home-starter-card"
    timeout: 25000

# Join 7K Steps (one check-off task) and open it.
- openLink: "griit://challenge/e44f0001-4000-4000-8000-000000000002"
- extendedWaitUntil:
    visible: "Join 7K Steps"
    timeout: 20000
- tapOn: "Join 7K Steps"
- tapOn:
    text: "Send it"
    optional: true
- tapOn:
    text: "Go back"
    optional: true
- extendedWaitUntil:
    visible: "Walk 7,000 steps|^Done$"
    timeout: 20000
- tapOn:
    id: "home-task"
    optional: true
- extendedWaitUntil:
    visible: "^Done$"
    timeout: 15000
- tapOn: "^Done$"

# 04.1 the sheet: label, two chips (Friends selected by default), Keep it private.
- extendedWaitUntil:
    visible: "Who sees this"
    timeout: 10000
- assertVisible: "Friends"
- assertVisible: "Everyone"
- assertVisible: "Your friends see it in their feed."
- assertVisible: "Keep it private"
- assertVisible:
    id: "post-choice-post"
- takeScreenshot: build90-04-post-choice
- tapOn: "Everyone"
- assertVisible: "Anyone on GRIIT can see it in the feed."
- tapOn: "Friends"

# Keep it private ends the flow on today's tasks or Day secured.
- tapOn:
    id: "post-choice-keep"
- extendedWaitUntil:
    visible: "1 of .* done|Day secured|Day 1 secured.*"
    timeout: 15000
- takeScreenshot: build90-04-kept-private
- assertNotVisible: "Who sees this"
