appId: app.griit.challenge-tracker
---
# Build 92 chunk 11.4 request budget: a fresh guest (Welcome → Faith and prayer → Start here → Join
# → first task → Done → Post to friends → Day secured → Home), then Profile, Discover, Activity and a
# relaunch. Requests are counted from Railway's HTTP log (scripts/count-trpc-minute.py).
- launchApp:
    clearState: true
    permissions:
      notifications: deny
      camera: deny
- extendedWaitUntil:
    visible: "http://localhost:8081|Start|Continue"
    timeout: 60000
- tapOn:
    text: "http://localhost:8081"
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - swipe:
          start: "50%,60%"
          end: "50%,98%"
          duration: 400
- extendedWaitUntil:
    visible: "Start"
    timeout: 60000
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Faith and prayer"
    timeout: 15000
- tapOn: "Faith and prayer"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "How it works"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Start here"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "start-here-join-.*"
    timeout: 20000
- tapOn:
    id: "start-here-join-.*"
    index: 0
- extendedWaitUntil:
    visible: "You’re in. Day 1 is today."
    timeout: 25000
- waitForAnimationToEnd:
    timeout: 1500
- extendedWaitUntil:
    visible: "^Done$|Done without photo"
    timeout: 15000
- tapOn: "^Done$|Done without photo"
- extendedWaitUntil:
    visible: "Post your proof"
    timeout: 20000
- tapOn: "Post to friends"
- extendedWaitUntil:
    visible: "Every task today is done.*|Day 1 secured.*|Day secured.*"
    timeout: 20000
- tapOn: "^Done$"
- extendedWaitUntil:
    visible: "Not now|Save your challenge.*"
    timeout: 8000
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- extendedWaitUntil:
    visible: "^Home$"
    timeout: 20000
- extendedWaitUntil:
    visible: "build92-never-shown"
    timeout: 4000
    optional: true
- tapOn: "^Profile$"
- extendedWaitUntil:
    visible: "Edit profile|Save your progress|Settings"
    timeout: 15000
- tapOn: "^Discover$"
- extendedWaitUntil:
    visible: "Featured"
    timeout: 15000
- tapOn: "^Activity$"
- extendedWaitUntil:
    visible: "build92-never-shown"
    timeout: 3000
    optional: true
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "^Home$"
    timeout: 30000
- extendedWaitUntil:
    visible: "build92-never-shown"
    timeout: 5000
    optional: true
