appId: app.griit.challenge-tracker
---
- launchApp:
    stopApp: true
- openLink: griit://dev/build80
- extendedWaitUntil:
    visible:
      id: build80-photo
    timeout: 25000
- scrollUntilVisible:
    element:
      id: build80-home
    direction: DOWN
- tapOn:
    id: build80-open
- assertVisible:
    id: build80-detail
