appId: app.griit.challenge-tracker
---
# Build 92 chunk 03: partial logs add up (Part 1 checklist lines 149–152).
# Fresh guest → wizard → one custom Run task, 3 km (the wizard default unit), self-reported → Home.
# 2 km in 20:00 → "2 of 3 km · 1 km short" + the won't-count line → "Save 2 mi · won't count today"
# → Home toast "Run saved. 1 mi short, so today isn't secured yet.", the row stays open with
# "2 of 3 km logged" → open it again → "2 of 3 km so far today" + Add distance → 1 km in 10:00
# → Done → post sheet → Post → Day secured. Along the way: 1 km in 2:00 (3:13 /mi) shows the pace line and
# disables Done; the duration field takes h:mm:ss.
- runFlow: build92-guest-home.yaml

# Wizard: a custom 3 mi run.
- tapOn:
    id: "tab-create"
- extendedWaitUntil:
    visible: "Create a challenge.*"
    timeout: 15000
- tapOn: "Create a challenge.*"
- extendedWaitUntil:
    visible: "Step 1 of 3"
    timeout: 20000
- tapOn: "Challenge title"
- inputText: "Three mile days"
- tapOn: "Examples:.*" # non-interactive text: dismisses the keyboard on the SE where it covers the chips
- scrollUntilVisible:
    element:
      text: "Fitness"
    direction: DOWN
    timeout: 8000
- tapOn: "Fitness"
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
    timeout: 8000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "What must get done daily?"
    timeout: 15000
- tapOn: "Custom"
- tapOn: "Add a task"
- extendedWaitUntil:
    visible: "Task name"
    timeout: 15000
- tapOn: "e.g. Read 10 pages"
- inputText: "Morning run"
- tapOn: "What you do"
- tapOn: "^Run$"
- extendedWaitUntil:
    visible: "Distance"
    timeout: 10000
- tapOn: "Distance"
- inputText: "3"
- tapOn: "What you do" # non-interactive label: dismisses the keyboard, which hides the sheet footer on the SE
- extendedWaitUntil:
    visible: "Add task"
    timeout: 5000
- tapOn: "Add task"
- extendedWaitUntil:
    visible: "Morning run"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
    timeout: 8000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "How strict?"
    timeout: 15000
- tapOn: "Standard.*"
- tapOn: "Review"
- extendedWaitUntil:
    visible: "Start the challenge"
    timeout: 15000
- tapOn: "Start the challenge"
- extendedWaitUntil:
    visible: "You're in. Day 1 is.*"
    timeout: 30000
- tapOn: "Back to Home"
- tapOn:
    text: "^Later$"
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 30000
- extendedWaitUntil:
    visible: "Morning run"
    timeout: 30000

# Log 1: an impossible pace is said inline and Done is off; then 2 mi in 20:00 is short.
- scrollUntilVisible:
    element:
      text: "Morning run"
      index: 0
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Morning run"
    index: 0
- extendedWaitUntil:
    visible:
      id: "log-distance"
    timeout: 20000
- tapOn:
    id: "log-distance"
- inputText: "1"
- tapOn:
    id: "log-duration"
- inputText: "200"
- assertVisible: "That pace looks off. Check the distance and time."
- takeScreenshot: P1-31-pace-off
- tapOn:
    id: "log-duration"
- eraseText: 8
# One digit at a time: the field reformats on every keystroke (mm:ss → h:mm:ss).
- inputText: "1"
- inputText: "0"
- inputText: "5"
- inputText: "0"
- inputText: "0"
- assertVisible: "1:05:00"
- takeScreenshot: P1-30-run-hmmss
- eraseText: 8
- inputText: "2"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- tapOn:
    id: "log-distance"
- eraseText: 3
- inputText: "2"
- tapOn:
    text: "Self-reported."
    index: 0
- extendedWaitUntil:
    visible: "2 of 3 km · 1 km short"
    timeout: 10000
- assertVisible: "Today won't count toward the 3 km goal.*"
- assertVisible: "Save 2 km · won't count today"
- takeScreenshot: P1-32-run-short
- tapOn: "Save 2 km · won't count today"
- extendedWaitUntil:
    visible: "Run saved\\. 1 km short, so today isn't secured yet\\."
    timeout: 30000
- assertNotVisible: "Every task today is done."
# The row's caption ("… · 2 of 3 km logged") sits under the challenge's a11y label, so it is
# checked by the P1-33 frame and lib/partial-log.test.ts, not by text here.
- takeScreenshot: P1-33-home-after-short

# Log 2: the second log adds up and finishes the task.
- scrollUntilVisible:
    element:
      text: "Morning run"
      index: 0
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Morning run"
    index: 0
- extendedWaitUntil:
    visible: "2 of 3 km so far today"
    timeout: 20000
- assertVisible: "Add distance"
- takeScreenshot: P1-35-run-so-far
- tapOn:
    id: "log-distance"
- inputText: "1"
- tapOn:
    id: "log-duration"
- inputText: "1000"
- tapOn:
    text: "Self-reported."
    index: 0
- assertNotVisible: "km short"
- tapOn: "^Done$"
- extendedWaitUntil:
    visible: "Post your proof"
    timeout: 20000
- tapOn:
    id: "post-choice-post"
- extendedWaitUntil:
    visible: "Every task today is done."
    timeout: 60000
- assertVisible: "Morning run"
- takeScreenshot: P1-35-day-secured-after-partials
- tapOn: "^Done$"
- tapOn:
    text: "^Later$"
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 20000
