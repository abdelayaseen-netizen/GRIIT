appId: app.griit.challenge-tracker
---
# Tap Done. Home's count updates within 1 second, before the server finishes.
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- tapOn:
    text: "http://localhost:8081"
    optional: true
- tapOn:
    text: "http://localhost:8082"
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- extendedWaitUntil:
    visible: "Start"
    timeout: 45000
- tapOn: "Start"
- tapOn: "Physical toughness.*"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "How it works"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Show Up 7.*"
    timeout: 20000
- tapOn: "Set this up later"
- extendedWaitUntil:
    visible: "No reminders for now"
    timeout: 20000
- tapOn: "No reminders for now"
- extendedWaitUntil:
    visible: "No challenge yet.*"
    timeout: 25000
- tapOn: "Profile"
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "You're using GRIIT as a guest.*"
    timeout: 15000
- tapOn: "You're using GRIIT as a guest.*"
- extendedWaitUntil:
    visible: "Continue with email"
    timeout: 15000
- tapOn: "Continue with email"
- tapOn:
    id: "account-email"
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: "account-password"
- inputText: "Build90-done-test"
- hideKeyboard
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Send it|Home|No challenge yet.*"
    timeout: 20000
- tapOn:
    text: "Send it"
    optional: true
- tapOn:
    text: "Go back"
    optional: true
- openLink: "griit://challenge/e44f0001-4000-4000-8000-000000000002"
- extendedWaitUntil:
    visible: "Join 7K Steps"
    timeout: 20000
- tapOn: "Join 7K Steps"
- extendedWaitUntil:
    visible: "Walk 7,000 steps"
    timeout: 20000
- tapOn:
    id: "home-task"
- extendedWaitUntil:
    visible: "^Done$"
    timeout: 15000
- tapOn: "^Done$"
- extendedWaitUntil:
    visible: "1 of .* done"
    timeout: 1000
