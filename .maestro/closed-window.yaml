appId: app.griit.challenge-tracker
---
- launchApp:
    stopApp: true
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
- tapOn: "Home"
- assertVisible: "Today"
- tapOn: "Up and out of bed"
- assertVisible: "Window closed at 6:30 am. Today is not secured."
- assertVisible: "It opens again at the same time tomorrow."
- tapOn: "Back"
- assertVisible: "Today"
