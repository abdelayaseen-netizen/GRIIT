appId: app.griit.challenge-tracker
---
# Build 92 12.3: a curse word in a new challenge's title is refused, with the message naming
# the field. Build 91 opens the wizard from Create; build 92 opens a chooser first.
- runFlow: guest-home.yaml
- tapOn: "Create"
- tapOn:
    text: "Create a challenge.*"
    optional: true
- extendedWaitUntil:
    visible: "Step 1 of 3"
    timeout: 15000
- tapOn: "Challenge title"
- inputText: "Fuck Mondays"
- tapOn: "Name your challenge"
- tapOn: "Fitness"
- tapOn: "Continue"
# The title may be refused on this step already; otherwise at the end of the wizard.
- runFlow:
    when:
      notVisible: "Those words aren't allowed in a challenge title.*"
    commands:
      - extendedWaitUntil:
          visible: "What must get done daily?"
          timeout: 10000
      - tapOn: "Custom"
      - tapOn: "Add a task"
      - extendedWaitUntil:
          visible: "Task name"
          timeout: 10000
      - tapOn: "e.g. Read 10 pages"
      - inputText: "Walk ten minutes"
      - tapOn: "Task name"
      - tapOn: "Add task"
      - extendedWaitUntil:
          visible: "Walk ten minutes"
          timeout: 10000
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "How strict?"
          timeout: 10000
      - tapOn: "Standard.*"
      - tapOn: "Review"
      - extendedWaitUntil:
          visible: "Start the challenge"
          timeout: 10000
      - tapOn: "Start the challenge"
- extendedWaitUntil:
    visible: "Those words aren't allowed in a challenge title\\. Try different ones\\."
    timeout: 20000
- assertNotVisible: "You're in. Day 1 is.*"
- takeScreenshot: b92-12-curse-title
